        <main id="community-main-content">

            <div class="community-content-wrapper">

                <div class="posts-section">
                    <div class="member-post">

                        <div class="member-details">

                    <div class="member-post">

                        <div class="member-details">

                            <div class="member-comment">

                    <div class="member-post">
                        <div class="member-image">

                        </div>

                            <p class="member-name">(Name of Member / Customer)</p>

            <div class="instagram-embed">
                <iframe 
                    src="https://www.instagram.com/reel/DICJVWDOkxn/embed/" 
                    width="420" 
                    height="480" 
                    frameborder="0"
                    scrolling="no"
                    allowtransparency="true"
                    title="Instagram reel from nashypaws account">
                </iframe>
            </div>



        </main>

        <script>
            const ONE_HOUR_MS = 60 * 60 * 1000; 

            function loadAndFilterPosts() {
                const currentTime = new Date().getTime();
                
                let storedPosts = localStorage.getItem('communityPosts');
                let postsArray = storedPosts ? JSON.parse(storedPosts) : [];
                
                const freshPosts = postsArray.filter(post => {
                    const postAge = currentTime - post.timestamp;
                    return postAge < ONE_HOUR_MS;
                });

                if (freshPosts.length !== postsArray.length) {
                    localStorage.setItem('communityPosts', JSON.stringify(freshPosts));
                }

                const postsSection = document.querySelector('.posts-section');
                postsSection.innerHTML = ''; 

                freshPosts.forEach(post => {
                    
                    const newPost = document.createElement('div');
                    newPost.classList.add('member-post'); 

                    const imageContainer = document.createElement('div');
                    imageContainer.classList.add('member-image');
                    const imgElement = document.createElement('img');
                    imgElement.src = post.image; 
                    imgElement.alt = "User's pet post";
                    imgElement.title = "User pet post image";
                    imageContainer.appendChild(imgElement);

                    const detailsContainer = document.createElement('div');
                    detailsContainer.classList.add('member-details');

                    const nameElement = document.createElement('p');
                    nameElement.classList.add('member-name');
                    const nameText = post.name || '(Anonymous Pet Lover)';
                    nameElement.textContent = "Name: " + nameText; 

                    const commentContainer = document.createElement('div');
                    commentContainer.classList.add('member-comment');
                    const commentParagraph = document.createElement('p');
                    commentParagraph.textContent = post.comment || "No comment provided."; 
                    commentContainer.appendChild(commentParagraph);

                    detailsContainer.appendChild(nameElement);
                    detailsContainer.appendChild(commentContainer);

                    newPost.appendChild(imageContainer);
                    newPost.appendChild(detailsContainer);

                    postsSection.appendChild(newPost);
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                loadAndFilterPosts();

                setInterval(loadAndFilterPosts, ONE_HOUR_MS); 
            });
        </script>
    </body> 
</html>
